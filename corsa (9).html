<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Piano Corsa 8 Settimane 🏃</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Corsa 8W">
  <link rel="apple-touch-icon" href="icon-corsa.png">
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    :root {
      --bg-main: #F4F7F9;
      --primary: #0066CC;
      --deep: #003366;
      --sky: #E0F2FE;
      --gold: #FFB703;
      --text-dark: #0F172A;
      --text-muted: #64748B;
      --card-bg: #FFFFFF;
      --radius-lg: 20px;
      --radius-md: 14px;
      --shadow: 0 10px 25px -5px rgba(0,102,204,0.08);
      --success: #10B981;
      --orange: #F59E0B;
      --red: #EF4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background: var(--bg-main); color: var(--text-dark); padding-bottom: 90px; max-width: 480px; margin: 0 auto; min-height: 100vh; }

    header {
      background: linear-gradient(135deg, var(--deep) 0%, var(--primary) 100%);
      color: white; padding: 28px 24px 22px; border-bottom-left-radius: 28px; border-bottom-right-radius: 28px;
    }
    .header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .brand-logo { display: flex; align-items: center; gap: 12px; }
    .logo-badge {
      background: var(--gold); color: var(--deep); width: 44px; height: 44px; border-radius: 14px;
      display: flex; align-items: center; justify-content: center; font-size: 1.3rem;
      box-shadow: 0 4px 12px rgba(255,183,3,0.4);
    }
    .brand-title h1 { font-size: 1.2rem; font-weight: 700; }
    .brand-title p { font-size: 0.78rem; opacity: 0.8; }
    .stats-widget {
      background: rgba(255,255,255,0.12); backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.2); padding: 12px 16px;
      border-radius: var(--radius-md); display: flex; justify-content: space-between; align-items: center;
    }
    .stats-widget .sw-label { font-size: 0.82rem; opacity: 0.9; }
    .stats-widget .sw-val { font-size: 0.82rem; font-weight: 700; }
    .progress-track { height: 6px; background: rgba(255,255,255,0.2); border-radius: 3px; overflow: hidden; margin-top: 8px; }
    .progress-fill { height: 100%; background: var(--gold); border-radius: 3px; transition: width 0.4s ease; }
    .sync-badge { margin-top: 6px; font-size: 0.68rem; opacity: 0.5; text-align: right; }

    main { padding: 20px 20px; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    .section-title { font-size: 1.1rem; font-weight: 700; color: var(--text-dark); display: flex; align-items: center; gap: 8px; margin-bottom: 14px; }

    /* Pills */
    .pills { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 12px; margin-bottom: 14px; scroll-behavior: smooth; }
    .pills::-webkit-scrollbar { display: none; }
    .pill {
      background: var(--card-bg); padding: 8px 14px; border-radius: 30px; font-size: 0.82rem;
      font-weight: 600; color: var(--text-muted); white-space: nowrap; border: 1px solid #E2E8F0;
      cursor: pointer; transition: all 0.2s; position: relative;
    }
    .pill.active { background: var(--primary); color: white; border-color: var(--primary); box-shadow: 0 4px 10px rgba(0,102,204,0.3); }
    .pill.current::after { content: ''; position: absolute; bottom: -4px; left: 50%; transform: translateX(-50%); width: 6px; height: 6px; background: var(--gold); border-radius: 50%; }

    /* Cards */
    .card {
      background: var(--card-bg); border-radius: var(--radius-lg); padding: 16px;
      margin-bottom: 12px; box-shadow: var(--shadow); border: 1px solid #F1F5F9;
      transition: transform 0.2s ease;
    }
    .card.done { opacity: 0.55; }
    .card-top { display: flex; align-items: flex-start; gap: 14px; margin-bottom: 10px; }
    .card-icon {
      width: 48px; height: 48px; border-radius: var(--radius-md);
      display: flex; align-items: center; justify-content: center; font-size: 1.2rem; flex-shrink: 0;
    }
    .icon-easy { background: #DCFCE7; color: #16A34A; }
    .icon-speed { background: #FEF3C7; color: #D97706; }
    .icon-long { background: #E0F2FE; color: #0284C7; }
    .icon-test { background: #FCE7F3; color: #DB2777; }
    .card-info { flex: 1; }
    .card-tag { font-size: 0.75rem; font-weight: 700; text-transform: uppercase; color: var(--primary); }
    .card-name { font-size: 1.05rem; font-weight: 700; color: var(--text-dark); margin: 2px 0 4px; }
    .card-name.done-text { text-decoration: line-through; color: var(--text-muted); }
    .card-date { font-size: 0.8rem; color: var(--text-muted); }
    .check-btn {
      width: 34px; height: 34px; border-radius: 10px; border: 2px solid #D1D5DB;
      background: white; color: transparent; cursor: pointer; display: flex;
      align-items: center; justify-content: center; font-size: 1rem; transition: all 0.2s; flex-shrink: 0; margin-top: 4px;
    }
    .check-btn.done { border-color: var(--success); background: var(--success); color: white; }
    .card-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 8px; }
    .cs { background: var(--bg-main); border-radius: 10px; padding: 6px 8px; text-align: center; }
    .cs-val { font-size: 0.9rem; font-weight: 700; color: var(--text-dark); }
    .cs-lbl { font-size: 0.68rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.04em; }
    .card-tip {
      background: #FFFBEB; border-left: 3px solid var(--gold); padding: 10px 12px;
      border-radius: 6px; font-size: 0.85rem; color: #78350F; line-height: 1.45;
    }
    .week-tip { margin-bottom: 14px; }

    /* Overview */
    .ov-card {
      background: var(--card-bg); border-radius: var(--radius-md); padding: 14px 16px;
      margin-bottom: 10px; box-shadow: var(--shadow); border: 1px solid #F1F5F9;
      cursor: pointer; display: flex; align-items: center; gap: 12px; transition: all 0.2s;
    }
    .ov-card.current-week { border-color: var(--primary); border-width: 2px; }
    .ov-num {
      width: 38px; height: 38px; border-radius: 12px; background: var(--deep);
      color: white; display: flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: 1rem; flex-shrink: 0;
    }
    .ov-num.complete { background: var(--success); }
    .ov-body { flex: 1; }
    .ov-title { font-weight: 700; font-size: 0.9rem; }
    .ov-sub { font-size: 0.78rem; color: var(--text-muted); margin-top: 2px; }
    .ov-tags { display: flex; gap: 5px; margin-top: 6px; flex-wrap: wrap; }
    .ov-tag { padding: 2px 8px; border-radius: 6px; font-size: 0.7rem; font-weight: 600; }
    .ov-prog { width: 50px; height: 5px; background: #E2E8F0; border-radius: 3px; overflow: hidden; flex-shrink: 0; }
    .ov-prog-fill { height: 100%; border-radius: 3px; }

    /* Volume chart */
    .vol-chart { background: var(--card-bg); border-radius: var(--radius-lg); padding: 16px 18px; box-shadow: var(--shadow); border: 1px solid #F1F5F9; margin-top: 12px; }
    .vol-chart h3 { font-size: 0.9rem; font-weight: 700; margin-bottom: 10px; }
    .vol-bars { display: flex; align-items: flex-end; gap: 6px; height: 90px; }
    .vol-col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; }
    .vol-val { font-size: 0.65rem; font-weight: 700; color: var(--text-muted); }
    .vol-bar { width: 100%; border-radius: 6px 6px 2px 2px; min-height: 6px; }
    .vol-bar.load { background: linear-gradient(180deg, #5C8AB8, var(--deep)); }
    .vol-bar.deload { background: linear-gradient(180deg, #6EE7B7, var(--success)); }
    .vol-lbl { font-size: 0.65rem; color: var(--text-muted); }
    .vol-legend { display: flex; gap: 14px; margin-top: 8px; justify-content: center; font-size: 0.72rem; color: var(--text-muted); }

    /* Analysis */
    .upload-zone {
      border: 2px dashed #CBD5E1; border-radius: var(--radius-lg); padding: 28px 16px;
      text-align: center; background: var(--card-bg); cursor: pointer; margin-bottom: 16px;
      box-shadow: var(--shadow); transition: all 0.2s;
    }
    .upload-zone:active { border-color: var(--primary); background: var(--sky); }
    .upload-zone i { font-size: 2rem; color: var(--primary); margin-bottom: 6px; }
    .upload-zone .uz-t { font-size: 0.95rem; font-weight: 700; color: var(--text-dark); }
    .upload-zone .uz-s { font-size: 0.78rem; color: var(--text-muted); margin-top: 2px; }

    .summary-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 16px; }
    .summary-card {
      background: var(--card-bg); border-radius: var(--radius-md); padding: 14px;
      box-shadow: var(--shadow); border: 1px solid #F1F5F9; text-align: center;
    }
    .sc-val { font-size: 1.4rem; font-weight: 800; color: var(--deep); }
    .sc-lbl { font-size: 0.72rem; color: var(--text-muted); text-transform: uppercase; font-weight: 600; }

    .act-card {
      background: var(--card-bg); border-radius: var(--radius-lg); padding: 16px;
      margin-bottom: 10px; box-shadow: var(--shadow); border: 1px solid #F1F5F9; cursor: pointer;
    }
    .act-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .act-date { font-weight: 700; font-size: 0.95rem; color: var(--deep); }
    .act-name { font-size: 0.78rem; color: var(--text-muted); }
    .act-del { background: none; border: none; color: #CBD5E1; font-size: 1.1rem; cursor: pointer; padding: 4px; }
    .act-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
    .as { background: var(--bg-main); border-radius: 10px; padding: 6px 4px; text-align: center; }
    .as-val { font-size: 0.95rem; font-weight: 800; color: var(--deep); }
    .as-lbl { font-size: 0.65rem; color: var(--text-muted); text-transform: uppercase; }
    .badge { display: inline-block; padding: 3px 10px; border-radius: 8px; font-size: 0.72rem; font-weight: 700; }
    .badge-hit { background: #DCFCE7; color: #16A34A; }
    .badge-close { background: #FEF3C7; color: #D97706; }
    .badge-miss { background: #FEE2E2; color: #DC2626; }
    .splits-tbl { width: 100%; border-collapse: collapse; font-size: 0.82rem; margin-top: 10px; }
    .splits-tbl th { text-align: left; font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; padding: 4px 6px; border-bottom: 1px solid #F1F5F9; }
    .splits-tbl td { padding: 6px; border-bottom: 1px solid #F8FAFC; }
    .pace-bg { height: 6px; background: #E2E8F0; border-radius: 3px; overflow: hidden; }
    .pace-fill { height: 100%; border-radius: 3px; }
    .pf-fast { background: var(--success); }
    .pf-ok { background: var(--orange); }
    .pf-slow { background: var(--red); }
    .prog-chart { background: var(--card-bg); border-radius: var(--radius-lg); padding: 16px; box-shadow: var(--shadow); border: 1px solid #F1F5F9; margin-bottom: 16px; }
    .prog-chart h3 { font-size: 0.9rem; font-weight: 700; margin-bottom: 8px; }
    .prog-chart .sub { font-size: 0.72rem; color: var(--text-muted); margin-bottom: 8px; }
    .chart-svg { width: 100%; height: 140px; }
    .no-data { text-align: center; padding: 30px; color: var(--text-muted); font-size: 0.88rem; }

    /* Rules */
    .rule-card {
      background: var(--card-bg); border-radius: var(--radius-lg); padding: 16px;
      margin-bottom: 12px; box-shadow: var(--shadow); border: 1px solid #F1F5F9;
      display: flex; align-items: flex-start; gap: 14px;
    }
    .rule-icon { font-size: 1.6rem; flex-shrink: 0; }
    .rule-title { font-weight: 700; font-size: 0.92rem; color: var(--deep); margin-bottom: 4px; }
    .rule-text { font-size: 0.85rem; color: var(--text-muted); line-height: 1.5; }

    /* Bottom Nav */
    .bottom-nav {
      position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
      width: 100%; max-width: 480px; background: rgba(255,255,255,0.95);
      backdrop-filter: blur(12px); display: flex; justify-content: space-around;
      padding: 12px 0 16px; border-top: 1px solid #E2E8F0;
      border-top-left-radius: 20px; border-top-right-radius: 20px; z-index: 1000;
    }
    .nav-link {
      color: var(--text-muted); text-decoration: none; font-size: 0.72rem; font-weight: 600;
      display: flex; flex-direction: column; align-items: center; gap: 4px;
      border: none; background: none; cursor: pointer;
    }
    .nav-link i { font-size: 1.2rem; }
    .nav-link.active { color: var(--primary); }
  </style>
</head>
<body>

<header>
  <div class="header-top">
    <div class="brand-logo">
      <div class="logo-badge"><i class="fa-solid fa-person-running"></i></div>
      <div class="brand-title">
        <h1>Piano Corsa 8 Settimane</h1>
        <p>5:45/km → 5:30/km · 6 km → 10 km</p>
      </div>
    </div>
    <i class="fa-solid fa-fire-flame-curved" style="font-size:1.3rem; color:var(--gold);"></i>
  </div>
  <div class="stats-widget">
    <div><span class="sw-label" id="progLabel">Progresso: 0/21</span></div>
    <div><span class="sw-val" id="progPct">0%</span></div>
  </div>
  <div class="progress-track"><div class="progress-fill" id="progBar" style="width:0%"></div></div>
  <div class="sync-badge">☁️ Sincronizzato via Firebase</div>
</header>

<main>
  <div id="tab-piano" class="tab-content active"></div>
  <div id="tab-overview" class="tab-content"></div>
  <div id="tab-analisi" class="tab-content"></div>
  <div id="tab-regole" class="tab-content"></div>
</main>

<input type="file" id="gpxInput" accept=".gpx,.fit" style="display:none" multiple>

<nav class="bottom-nav">
  <button class="nav-link active" onclick="switchTab('tab-piano',this)"><i class="fa-solid fa-calendar-day"></i><span>Piano</span></button>
  <button class="nav-link" onclick="switchTab('tab-overview',this)"><i class="fa-solid fa-chart-simple"></i><span>8 Sett.</span></button>
  <button class="nav-link" onclick="switchTab('tab-analisi',this)"><i class="fa-solid fa-chart-line"></i><span>Analisi</span></button>
  <button class="nav-link" onclick="switchTab('tab-regole',this)"><i class="fa-solid fa-lightbulb"></i><span>Regole</span></button>
</nav>

<script>
// ========== FIREBASE ==========
firebase.initializeApp({
  apiKey:"AIzaSyCX5h62pNt0qUuav5ez3Mbj_E7GCNaEZP4", authDomain:"dieta-spesa.firebaseapp.com",
  databaseURL:"https://dieta-spesa-default-rtdb.europe-west1.firebasedatabase.app", projectId:"dieta-spesa"
});
const db=firebase.database(), completedRef=db.ref("corsa/completed"), activitiesRef=db.ref("corsa/activities");

// ========== DATA ==========
const PLAN_START=new Date(2026,6,13);
function getWeekDates(wi){const s=new Date(PLAN_START);s.setDate(s.getDate()+wi*7);const e=new Date(s);e.setDate(e.getDate()+6);const f=d=>d.getDate()+"/"+(d.getMonth()+1);return{start:s,end:e,label:f(s)+" – "+f(e)};}
function getCurrentWeekIndex(){const d=Math.floor((new Date()-PLAN_START)/(7*864e5));return Math.max(0,Math.min(7,d));}

const WEEKS=[
  {week:1,theme:"Costruire le basi",sessions:[{day:"Mar 15/7",type:"easy",label:"Corsa facile",duration:"30 min",distance:"5 km",pace:"6:15-6:30",note:"Ritmo conversazionale, non forzare"},{day:"Gio 17/7",type:"speed",label:"Variazioni",duration:"30 min",distance:"4.5 km",pace:"Misto",note:"10' riscaldamento + 4×1' veloci (5:15/km) con 1' recupero + 8' defaticamento"},{day:"Sab 19/7",type:"long",label:"Lungo",duration:"45 min",distance:"7 km",pace:"6:20→5:50",note:"Parti piano, ultimi 2 km più spinti"}],totalKm:16.5,tip:"Settimana di adattamento. L'obiettivo è sentirsi bene, non andare forte."},
  {week:2,theme:"Consolidamento",sessions:[{day:"Mar 22/7",type:"easy",label:"Corsa facile",duration:"30 min",distance:"5 km",pace:"6:10-6:20",note:"Cerca un ritmo naturale e rilassato"},{day:"Gio 24/7",type:"speed",label:"Variazioni",duration:"32 min",distance:"5 km",pace:"Misto",note:"10' riscaldamento + 5×1' veloci (5:15/km) con 1' recupero + 7' defaticamento"},{day:"Sab 26/7",type:"long",label:"Lungo",duration:"48 min",distance:"7.5 km",pace:"6:20→5:45",note:"Progressivo: ogni 2 km abbassa di 10-15 sec"}],totalKm:17.5,tip:"Aggiungi 1 ripetuta e mezzo km al lungo. Niente di più."},
  {week:3,theme:"Primo stimolo",sessions:[{day:"Mar 29/7",type:"easy",label:"Corsa facile",duration:"30 min",distance:"5 km",pace:"6:10-6:20",note:"Mantieni il ritmo comodo"},{day:"Gio 31/7",type:"speed",label:"Ripetute",duration:"35 min",distance:"5 km",pace:"Misto",note:"10' riscaldamento + 6×1' veloci (5:10/km) con 1' recupero + 7' defaticamento"},{day:"Dom 3/8",type:"long",label:"Lungo",duration:"50 min",distance:"8 km",pace:"6:15→5:45",note:"8 km totali, ultimi 3 km sotto i 5:50"}],totalKm:18,tip:"6 ripetute e 8 km di lungo: il corpo si sta adattando."},
  {week:4,theme:"Scarico — Recupero",sessions:[{day:"Mar 5/8",type:"easy",label:"Corsa facile",duration:"25 min",distance:"4 km",pace:"6:20-6:30",note:"Corsa blanda, recupero attivo"},{day:"Sab 9/8",type:"long",label:"Lungo facile",duration:"40 min",distance:"6.5 km",pace:"6:10-6:20",note:"Nessuna progressione, ritmo costante e comodo"}],totalKm:10.5,tip:"⚡ Settimana di scarico: -40% volume. Il miglioramento avviene nel recupero."},
  {week:5,theme:"Riprendere carico",sessions:[{day:"Mar 12/8",type:"easy",label:"Corsa facile",duration:"30 min",distance:"5 km",pace:"6:00-6:15",note:"Gambe fresche dopo lo scarico"},{day:"Gio 14/8",type:"speed",label:"Ripetute lunghe",duration:"35 min",distance:"5.5 km",pace:"Misto",note:"10' riscaldamento + 4×2' veloci (5:10-5:15/km) con 1'30\" recupero + 6' defaticamento"},{day:"Sab 16/8",type:"long",label:"Lungo",duration:"52 min",distance:"8.5 km",pace:"6:10→5:40",note:"Progressione graduale, ultimi 2 km a 5:40/km"}],totalKm:19,tip:"Le ripetute passano da 1' a 2': costruisci resistenza alla velocità."},
  {week:6,theme:"Spingere i limiti",sessions:[{day:"Mar 19/8",type:"easy",label:"Corsa facile",duration:"32 min",distance:"5.5 km",pace:"6:00-6:10",note:"Il ritmo facile dovrebbe sentirsi naturale"},{day:"Gio 21/8",type:"speed",label:"Ripetute lunghe",duration:"37 min",distance:"5.5 km",pace:"Misto",note:"10' riscaldamento + 5×2' veloci (5:05-5:15/km) con 1'30\" recupero + 5' defaticamento"},{day:"Dom 24/8",type:"long",label:"Lungo",duration:"55 min",distance:"9 km",pace:"6:10→5:35",note:"9 km, ultimi 3 km con passo target 5:35-5:40"}],totalKm:20,tip:"20 km settimanali: il volume più alto del piano. Ascolta il corpo."},
  {week:7,theme:"Affinare",sessions:[{day:"Mar 26/8",type:"easy",label:"Corsa facile",duration:"30 min",distance:"5 km",pace:"6:00-6:10",note:"Mantieni, non forzare"},{day:"Gio 28/8",type:"speed",label:"Fartlek",duration:"35 min",distance:"5.5 km",pace:"Misto",note:"10' riscaldamento + 20' fartlek libero + 5' defaticamento"},{day:"Sab 30/8",type:"long",label:"Lungo progressivo",duration:"58 min",distance:"9.5 km",pace:"6:10→5:30",note:"Chiudi gli ultimi 2 km sotto i 5:30"}],totalKm:20,tip:"Il fartlek insegna a gestire il ritmo a sensazione."},
  {week:8,theme:"Test finale",sessions:[{day:"Mar 2/9",type:"easy",label:"Corsa facile",duration:"25 min",distance:"4 km",pace:"6:10-6:20",note:"Gambe leggere, nessuno sforzo"},{day:"Gio 4/9",type:"easy",label:"Attivazione",duration:"20 min",distance:"3 km",pace:"6:00",note:"Corsa breve con 3-4 allunghi da 15\""},{day:"Sab 6/9",type:"test",label:"🏁 Test 6 km",duration:"~33 min",distance:"6 km",pace:"Target: 5:30",note:"Corri i tuoi 6 km a tutta! Punta a 5:30-5:35/km."}],totalKm:13,tip:"Momento della verità: vedi quanto hai migliorato."}
];
const T_ICONS={easy:'fa-leaf',speed:'fa-bolt',long:'fa-road',test:'fa-flag-checkered'};
const T_CLASSES={easy:'icon-easy',speed:'icon-speed',long:'icon-long',test:'icon-test'};
const T_LABELS={easy:'Facile',speed:'Velocità',long:'Lungo',test:'Test'};
const RULES=[
  {icon:'fa-turtle',emoji:'🐢',title:"Ritmo facile",text:"Il 70-80% della corsa deve essere a ritmo conversazionale. Se non riesci a parlare, stai andando troppo forte."},

  {icon:'fa-rotate',emoji:'🔄',title:"Ciclo 3+1",text:"3 settimane di carico crescente, 1 di scarico (-30/40% volume). A 55 anni il recupero è il miglioramento vero."},

// ========== STATE ==========
let state={view:'tab-piano',selWeek:getCurrentWeekIndex(),completed:{},activities:[],expanded:null};

// ========== FIREBASE LISTENERS ==========
function autoMatch(){
  const auto={};
  WEEKS.forEach((w,wi)=>{const ws=new Date(PLAN_START);ws.setDate(ws.getDate()+wi*7);ws.setHours(0,0,0,0);
    const we=new Date(ws);we.setDate(we.getDate()+7);
    const wa=state.activities.filter(a=>{const d=new Date(a.date);return d>=ws&&d<we;}).sort((a,b)=>new Date(a.date)-new Date(b.date));
    wa.forEach((a,i)=>{if(i<w.sessions.length)auto[wi+"-"+i]=true;});});
  let ch=false;
  Object.keys(auto).forEach(k=>{if(!state.completed[k]){state.completed[k]=true;completedRef.child(k).set(true);ch=true;}});
  if(ch)render();
}
completedRef.on("value",s=>{state.completed=s.val()||{};render();});
activitiesRef.on("value",s=>{const d=s.val();state.activities=d?Object.values(d).sort((a,b)=>new Date(a.date)-new Date(b.date)):[];autoMatch();render();});

function toggleSession(wi,si){const k=wi+"-"+si;state.completed[k]=!state.completed[k];completedRef.child(k).set(state.completed[k]);}
function wp(wi){const w=WEEKS[wi];let d=0;w.sessions.forEach((_,si)=>{if(state.completed[wi+"-"+si])d++;});return{done:d,total:w.sessions.length};}
function tp(){let d=0,t=0;WEEKS.forEach((w,wi)=>{w.sessions.forEach((_,si)=>{t++;if(state.completed[wi+"-"+si])d++;});});return{done:d,total:t};}

function switchTab(id,btn){
  document.querySelectorAll('.tab-content').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.nav-link').forEach(l=>l.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  btn.classList.add('active');
  state.view=id;
  render();
}
function setWeek(w){state.selWeek=w;state.view='tab-piano';
  document.querySelectorAll('.tab-content').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.nav-link').forEach(l=>l.classList.remove('active'));
  document.getElementById('tab-piano').classList.add('active');
  document.querySelector('.nav-link').classList.add('active');
  render();}

// GPX + FIT PARSER
function haversine(a,b,c,d){const R=6371e3,p=Math.PI/180,dp=(c-a)*p,dl=(d-b)*p;const x=Math.sin(dp/2)**2+Math.cos(a*p)*Math.cos(c*p)*Math.sin(dl/2)**2;return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));}

function parseGPX(x){const doc=new DOMParser().parseFromString(x,"text/xml"),pts=[],trkpts=doc.querySelectorAll("trkpt");
  const ne=doc.querySelector("trk > name")||doc.querySelector("name");const nm=ne?ne.textContent:"Corsa";
  trkpts.forEach(p=>{const la=parseFloat(p.getAttribute("lat")),lo=parseFloat(p.getAttribute("lon")),el=p.querySelector("ele"),ti=p.querySelector("time"),hr=p.querySelector("hr");
    pts.push({lat:la,lon:lo,time:ti?new Date(ti.textContent):null,hr:hr?parseInt(hr.textContent):null,dist:null});});
  if(pts.length<2)return null;
  return buildActivity(pts, nm, 'gpx');
}

function parseFIT(buf){
  const dv=new DataView(buf),u8=new Uint8Array(buf);
  const headerSize=u8[0], dataSize=dv.getUint32(4,true);
  let pos=headerSize;const end=headerSize+dataSize;
  const defs={},records=[];
  const FIT_EPOCH=new Date(Date.UTC(1989,11,31,0,0,0)).getTime();
  const SEMI=180/(2**31);

  function readVal(pos,size,bt){
    if(pos+size>buf.byteLength)return[null,pos+size];
    try{
      if(bt===0||bt===2||bt===10||bt===13)return[size===1?u8[pos]:dv.getUint32(pos,true),pos+size];
      if(bt===1)return[dv.getInt8(pos),pos+size];
      if(bt===3)return[size>=2?dv.getInt16(pos,true):null,pos+size];
      if(bt===4)return[size>=2?dv.getUint16(pos,true):null,pos+size];
      if(bt===5)return[size>=4?dv.getInt32(pos,true):null,pos+size];
      if(bt===6)return[size>=4?dv.getUint32(pos,true):null,pos+size];
      if(bt===8)return[size>=4?dv.getFloat32(pos,true):null,pos+size];
      if(bt===9)return[size>=8?dv.getFloat64(pos,true):null,pos+size];
    }catch(e){}
    return[null,pos+size];
  }

  while(pos<end&&pos<buf.byteLength){
    const rh=u8[pos];pos++;
    if(rh&0x80){// compressed timestamp
      const lmt=(rh>>5)&0x03;
      if(lmt in defs){const df=defs[lmt],fd={};
        for(const[fn,fs,bt] of df.f){const[v,np]=readVal(pos,fs,bt);pos=np;if(v!==null)fd[fn]=v;}
        if(df.g===20)records.push(fd);}
      continue;
    }
    const isDef=rh&0x40,lmt=rh&0x0F;
    if(isDef){
      pos++;const arch=u8[pos];pos++;const le=arch===0;
      const gmn=le?dv.getUint16(pos,true):dv.getUint16(pos,false);pos+=2;
      const nf=u8[pos];pos++;const fields=[];
      for(let i=0;i<nf;i++){fields.push([u8[pos],u8[pos+1],u8[pos+2]&0x1F]);pos+=3;}
      if(rh&0x20){const nd=u8[pos];pos++;pos+=nd*3;}
      defs[lmt]={g:gmn,f:fields};
    }else{
      if(!(lmt in defs))break;
      const df=defs[lmt],fd={};
      for(const[fn,fs,bt] of df.f){const[v,np]=readVal(pos,fs,bt);pos=np;if(v!==null)fd[fn]=v;}
      if(df.g===20)records.push(fd);
    }
  }

  // Convert FIT records to points
  const pts=[];let prevTs=0;
  for(const r of records){
    const ts=r[253],lat=r[0],lon=r[1];
    if(ts===undefined||lat===undefined||lon===undefined)continue;
    if(lat===0x7FFFFFFF||lon===0x7FFFFFFF)continue;
    if(ts<prevTs-10)continue;// skip corrupted timestamps
    prevTs=ts;
    let hr=r[3];if(hr!==undefined&&hr>=255)hr=null;
    let cad=r[4];if(cad!==undefined&&cad>=255)cad=null;
    let dist=r[5];if(dist!==undefined&&dist>=0xFFFFFFFF)dist=null;
    else if(dist!==undefined)dist=dist/100;// to meters
    pts.push({lat:lat*SEMI,lon:lon*SEMI,time:new Date(FIT_EPOCH+ts*1000),hr:hr||null,dist:dist||null});
  }
  if(pts.length<2)return null;
  return buildActivity(pts,'Corsa','fit');
}

function buildActivity(pts, name, source){
  // FIT: use native distance field (from device). GPX: use haversine
  const useNativeDist = source==='fit' && pts[0].dist!==null;
  let td=0,kd=0,kst=pts[0].time,kh=[],ah=[],sp=[];

  for(let i=1;i<pts.length;i++){
    let d;
    if(useNativeDist&&pts[i].dist!==null&&pts[i-1].dist!==null){
      d=pts[i].dist-pts[i-1].dist;if(d<0)d=0;
    }else{
      d=haversine(pts[i-1].lat,pts[i-1].lon,pts[i].lat,pts[i].lon);
    }
    td+=d;kd+=d;
    if(pts[i].hr){ah.push(pts[i].hr);kh.push(pts[i].hr);}
    if(kd>=1000){
      const s=(pts[i].time-kst)/1000;
      sp.push({km:sp.length+1,secs:s,avgHr:kh.length?Math.round(kh.reduce((a,b)=>a+b,0)/kh.length):null});
      kd-=1000;kst=pts[i].time;kh=[];
    }
  }
  if(kd>100){const s=(pts[pts.length-1].time-kst)/1000;
    sp.push({km:sp.length+1,secs:s/(kd/1000),avgHr:kh.length?Math.round(kh.reduce((a,b)=>a+b,0)/kh.length):null,partial:kd});}
  const tt=(pts[pts.length-1].time-pts[0].time)/1000,dk=td/1000;
  return{id:pts[0].time.getTime().toString(),name,source,date:pts[0].time.toISOString(),
    dateStr:pts[0].time.toLocaleDateString("it-IT",{weekday:"short",day:"numeric",month:"short",year:"numeric"}),
    timeStr:pts[0].time.toLocaleTimeString("it-IT",{hour:"2-digit",minute:"2-digit"})+" - "+pts[pts.length-1].time.toLocaleTimeString("it-IT",{hour:"2-digit",minute:"2-digit"}),
    distKm:Math.round(dk*100)/100,totalTimeSec:tt,avgPaceSec:tt/dk,
    avgHr:ah.length?Math.round(ah.reduce((a,b)=>a+b,0)/ah.length):null,maxHr:ah.length?Math.max(...ah):null,splits:sp};
}

function fmtP(s){const m=Math.floor(s/60),ss=Math.round(s%60);return m+":"+(ss<10?"0":"")+ss;}
function fmtT(s){const m=Math.floor(s/60),ss=Math.round(s%60);return m+":"+(ss<10?"0":"")+ss;}

function handleFiles(files){Array.from(files).forEach(f=>{
  const ext=f.name.split('.').pop().toLowerCase();
  if(ext==='gpx'){
    const r=new FileReader();r.onload=e=>{const a=parseGPX(e.target.result);if(a&&!state.activities.find(x=>x.id===a.id))activitiesRef.child(a.id).set(a);};r.readAsText(f);
  }else if(ext==='fit'){
    const r=new FileReader();r.onload=e=>{const a=parseFIT(e.target.result);if(a&&!state.activities.find(x=>x.id===a.id))activitiesRef.child(a.id).set(a);};r.readAsArrayBuffer(f);
  }
});}
function delAct(id){activitiesRef.child(id).remove();state.expanded=null;}
function togExp(i){state.expanded=state.expanded===i?null:i;render();}
function openFP(){document.getElementById("gpxInput").click();}
document.getElementById("gpxInput").addEventListener("change",function(e){handleFiles(e.target.files);this.value="";});
function getBadge(p){if(p<=330)return'<span class="badge badge-hit">🎯 Target!</span>';if(p<=345)return'<span class="badge badge-close">↘ Quasi</span>';return'<span class="badge badge-miss">↗ Sopra</span>';}
function getPcl(p){return p<=330?"pf-fast":p<=360?"pf-ok":"pf-slow";}

// ========== RENDER ==========
function render(){
  const t=tp(),pct=Math.round((t.done/t.total)*100);
  document.getElementById("progLabel").textContent="Progresso: "+t.done+"/"+t.total+" sessioni";
  document.getElementById("progPct").textContent=pct+"%";
  document.getElementById("progBar").style.width=pct+"%";
  if(state.view==='tab-piano')renderPlan();
  else if(state.view==='tab-overview')renderOverview();
  else if(state.view==='tab-analisi')renderAnalysis();
  else renderRules();
}

function renderPlan(){
  const wi=state.selWeek,w=WEEKS[wi],curW=getCurrentWeekIndex(),wd=getWeekDates(wi);
  let h='<div class="pills">';
  for(let i=0;i<8;i++){const isCur=i===curW;h+=`<button class="pill ${i===wi?'active':''} ${isCur?'current':''}" onclick="setWeek(${i})">S${i+1}</button>`;}
  h+='</div>';
  h+=`<div class="section-title"><i class="fa-solid fa-calendar-day" style="color:var(--primary)"></i> Settimana ${w.week}: ${w.theme}</div>`;
  h+=`<div style="font-size:0.8rem;color:var(--text-muted);margin:-8px 0 10px;display:flex;align-items:center;gap:6px"><i class="fa-regular fa-calendar"></i> ${wd.label}`;
  if(wi===curW)h+=' <span class="badge badge-hit" style="font-size:0.68rem">IN CORSO</span>';
  h+='</div>';
  h+=`<div class="card-tip week-tip">💡 ${w.tip}</div>`;
  w.sessions.forEach((s,si)=>{const dn=state.completed[wi+"-"+si];
    h+=`<div class="card ${dn?'done':''}"><div class="card-top">
      <div class="card-icon ${T_CLASSES[s.type]}"><i class="fa-solid ${T_ICONS[s.type]}"></i></div>
      <div class="card-info"><span class="card-tag">${T_LABELS[s.type]}</span>
        <div class="card-name ${dn?'done-text':''}">${s.label}</div>
        <div class="card-date"><i class="fa-regular fa-calendar"></i> ${s.day}</div></div>
      <button class="check-btn ${dn?'done':''}" onclick="toggleSession(${wi},${si})"><i class="fa-solid fa-check"></i></button></div>
      <div class="card-stats"><div class="cs"><div class="cs-val">${s.duration}</div><div class="cs-lbl">Durata</div></div>
        <div class="cs"><div class="cs-val">${s.distance}</div><div class="cs-lbl">Distanza</div></div>
        <div class="cs"><div class="cs-val">${s.pace}</div><div class="cs-lbl">Passo</div></div></div>
      <div class="card-tip">${s.note}</div></div>`;});
  document.getElementById("tab-piano").innerHTML=h;
}

function renderOverview(){
  const curW=getCurrentWeekIndex();let h='<div class="section-title"><i class="fa-solid fa-chart-simple" style="color:var(--primary)"></i> Panoramica</div>';
  WEEKS.forEach((w,wi)=>{const p=wp(wi),c=p.done===p.total,wd=getWeekDates(wi),isCur=wi===curW;
    h+=`<div class="ov-card ${isCur?'current-week':''}" onclick="setWeek(${wi})">
      <div class="ov-num ${c?'complete':''}">${c?'<i class="fa-solid fa-check"></i>':(wi+1)}</div>
      <div class="ov-body"><div class="ov-title">${isCur?'📍 ':''}Sett. ${w.week}: ${w.theme}</div>
        <div class="ov-sub"><i class="fa-regular fa-calendar"></i> ${wd.label} · ${w.totalKm} km</div>
        <div class="ov-tags">`;
    w.sessions.forEach(s=>{const bg=s.type==='easy'?'#DCFCE7':s.type==='speed'?'#FEF3C7':s.type==='long'?'#E0F2FE':'#FCE7F3';
      const cl=s.type==='easy'?'#16A34A':s.type==='speed'?'#D97706':s.type==='long'?'#0284C7':'#DB2777';
      h+=`<span class="ov-tag" style="background:${bg};color:${cl}">${s.distance}</span>`;});
    h+=`</div></div><div style="text-align:right;flex-shrink:0"><div style="font-size:0.72rem;color:var(--text-muted);margin-bottom:4px">${p.done}/${p.total}</div>
      <div class="ov-prog"><div class="ov-prog-fill" style="width:${p.total>0?(p.done/p.total)*100:0}%;background:${c?'var(--success)':'var(--primary)'}"></div></div></div></div>`;});
  h+='<div class="vol-chart"><h3><i class="fa-solid fa-chart-bar" style="color:var(--primary)"></i> Volume settimanale</h3><div class="vol-bars">';
  WEEKS.forEach((w,i)=>{const hp=(w.totalKm/20)*100;const dl=w.week===4||w.week===8;
    h+=`<div class="vol-col"><span class="vol-val">${w.totalKm}</span><div class="vol-bar ${dl?'deload':'load'}" style="height:${hp}%"></div><span class="vol-lbl">S${i+1}</span></div>`;});
  h+='</div><div class="vol-legend"><span>🟦 Carico</span><span>🟩 Scarico</span></div></div>';
  document.getElementById("tab-overview").innerHTML=h;
}

function renderAnalysis(){
  let h=`<div class="section-title"><i class="fa-solid fa-chart-line" style="color:var(--primary)"></i> Analisi</div>
    <div class="upload-zone" onclick="openFP()"><i class="fa-solid fa-cloud-arrow-up"></i><div class="uz-t">Carica file FIT o GPX da Strava</div><div class="uz-s">FIT = dati originali più precisi · Sincronizzato ovunque</div></div>`;
  const acts=state.activities;
  if(!acts.length){h+='<div class="no-data"><i class="fa-solid fa-running" style="font-size:2rem;color:#CBD5E1;margin-bottom:10px;display:block"></i>Nessuna attività caricata.<br>Esporta i GPX da Strava e caricali qui.</div>';document.getElementById("tab-analisi").innerHTML=h;return;}
  if(acts.length>=2)h+=renderProgChart(acts);
  const totalKm=acts.reduce((s,a)=>s+a.distKm,0),bestPace=Math.min(...acts.map(a=>a.avgPaceSec)),longest=Math.max(...acts.map(a=>a.distKm));
  h+=`<div class="summary-grid">
    <div class="summary-card"><div class="sc-val">${acts.length}</div><div class="sc-lbl">Uscite</div></div>
    <div class="summary-card"><div class="sc-val">${Math.round(totalKm*10)/10}</div><div class="sc-lbl">Km Totali</div></div>
    <div class="summary-card"><div class="sc-val">${fmtP(bestPace)}</div><div class="sc-lbl">Miglior Pace</div></div>
    <div class="summary-card"><div class="sc-val">${longest.toFixed(1)}</div><div class="sc-lbl">Km Max</div></div></div>`;
  [...acts].reverse().forEach((a,ri)=>{const idx=acts.length-1-ri;const exp=state.expanded===idx;
    h+=`<div class="act-card"><div class="act-top" onclick="togExp(${idx})">
      <div><div class="act-date">${a.dateStr}</div><div class="act-name">${a.name} · ${a.timeStr}</div></div>
      <div style="display:flex;align-items:center;gap:8px">${getBadge(a.avgPaceSec)}
        <button class="act-del" onclick="event.stopPropagation();delAct('${a.id}')"><i class="fa-solid fa-xmark"></i></button></div></div>
      <div class="act-stats"><div class="as"><div class="as-val">${a.distKm}</div><div class="as-lbl">Km</div></div>
        <div class="as"><div class="as-val">${fmtT(a.totalTimeSec)}</div><div class="as-lbl">Tempo</div></div>
        <div class="as"><div class="as-val">${fmtP(a.avgPaceSec)}</div><div class="as-lbl">Passo</div></div>
        <div class="as"><div class="as-val">${a.avgHr||'-'}</div><div class="as-lbl">FC</div></div></div>`;
    if(exp&&a.splits&&a.splits.length){
      h+='<table class="splits-tbl"><thead><tr><th>Km</th><th>Passo</th><th>FC</th><th></th></tr></thead><tbody>';
      const mx=Math.max(...a.splits.map(s=>s.secs)),mn=Math.min(...a.splits.map(s=>s.secs));
      a.splits.forEach(s=>{const bw=Math.max(10,Math.min(100,((mx-s.secs)/(mx-mn+1))*100));
        h+=`<tr><td style="font-weight:700">${s.km}${s.partial?' <span style="color:var(--text-muted);font-size:0.7rem">(${(s.partial/1000).toFixed(1)})</span>':''}</td>
          <td style="font-weight:700">${fmtP(s.secs)}/km</td><td>${s.avgHr?s.avgHr+' bpm':'-'}</td>
          <td style="width:50px"><div class="pace-bg"><div class="pace-fill ${getPcl(s.secs)}" style="width:${bw}%"></div></div></td></tr>`;});
      h+='</tbody></table>';
      if(a.splits.length>=4){const fh=a.splits.slice(0,Math.floor(a.splits.length/2)),sh=a.splits.slice(Math.floor(a.splits.length/2)).filter(s=>!s.partial);
        if(sh.length){const af=fh.reduce((s,x)=>s+x.secs,0)/fh.length,as2=sh.reduce((s,x)=>s+x.secs,0)/sh.length;
          if(as2<af)h+=`<div class="card-tip" style="margin-top:8px">🔥 Negative split! Seconda metà più veloce di ${Math.round(af-as2)} sec/km</div>`;}}}
    h+='</div>';});
  document.getElementById("tab-analisi").innerHTML=h;
}

function renderProgChart(acts){
  const W=300,H=130,pL=42,pR=10,pT=12,pB=25,cw=W-pL-pR,ch=H-pT-pB;
  const paces=acts.map(a=>a.avgPaceSec),minP=Math.min(...paces)-10,maxP=Math.max(...paces)+10;
  const pts=acts.map((a,i)=>({x:pL+(acts.length===1?cw/2:(i/(acts.length-1))*cw),y:pT+((a.avgPaceSec-minP)/(maxP-minP))*ch,pace:a.avgPaceSec,date:(a.dateStr||'').substring(0,6)}));
  const tY=pT+((330-minP)/(maxP-minP))*ch;
  let pathD=pts.map((p,i)=>(i===0?'M':'L')+p.x.toFixed(1)+','+p.y.toFixed(1)).join(' ');
  let svg=`<svg viewBox="0 0 ${W} ${H}" class="chart-svg" xmlns="http://www.w3.org/2000/svg">`;
  if(tY>=pT&&tY<=pT+ch){svg+=`<line x1="${pL}" y1="${tY.toFixed(1)}" x2="${pL+cw}" y2="${tY.toFixed(1)}" stroke="#10B981" stroke-width="1" stroke-dasharray="4,3" opacity="0.6"/>`;
    svg+=`<text x="${pL-3}" y="${tY.toFixed(1)}" text-anchor="end" font-size="8" fill="#10B981" dy="3">5:30</text>`;}
  for(let p=Math.ceil(minP/30)*30;p<=maxP;p+=30){const y=pT+((p-minP)/(maxP-minP))*ch;
    svg+=`<text x="${pL-3}" y="${y.toFixed(1)}" text-anchor="end" font-size="8" fill="#94A3B8" dy="3">${fmtP(p)}</text>`;
    svg+=`<line x1="${pL}" y1="${y.toFixed(1)}" x2="${pL+cw}" y2="${y.toFixed(1)}" stroke="#F1F5F9" stroke-width="0.5"/>`;}
  svg+=`<path d="${pathD}" fill="none" stroke="var(--deep)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>`;
  pts.forEach(p=>{svg+=`<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="4.5" fill="var(--deep)" stroke="white" stroke-width="2"/>`;
    svg+=`<text x="${p.x.toFixed(1)}" y="${(p.y-9).toFixed(1)}" text-anchor="middle" font-size="8" font-weight="700" fill="var(--text-dark)">${fmtP(p.pace)}</text>`;});
  if(pts.length<=12)pts.forEach(p=>{svg+=`<text x="${p.x.toFixed(1)}" y="${H-3}" text-anchor="middle" font-size="6.5" fill="#94A3B8">${p.date}</text>`;});
  svg+='</svg>';
  return `<div class="prog-chart"><h3><i class="fa-solid fa-chart-line" style="color:var(--primary)"></i> Progressione passo medio</h3>
    <div class="sub">Linea tratteggiata = target 5:30/km · Più in basso = più veloce</div>${svg}</div>`;
}

function renderRules(){
  let h='<div class="section-title"><i class="fa-solid fa-lightbulb" style="color:var(--primary)"></i> Regole d\'oro</div>';
  RULES.forEach(r=>{h+=`<div class="rule-card"><div class="rule-icon">${r.emoji}</div><div><div class="rule-title">${r.title}</div><div class="rule-text">${r.text}</div></div></div>`;});
  document.getElementById("tab-regole").innerHTML=h;
}

render();
</script>
