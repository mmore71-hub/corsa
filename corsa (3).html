function getWeekDates(wi) {
  const start = new Date(PLAN_START); start.setDate(start.getDate() + wi * 7);
  const end = new Date(start); end.setDate(end.getDate() + 6);
  const fmt = d => d.getDate() + "/" + (d.getMonth()+1);
  return { start, end, label: fmt(start) + " – " + fmt(end) };
}
function getCurrentWeekIndex() {
  const now = new Date(); const diff = Math.floor((now - PLAN_START) / (7*24*60*60*1000));
  return Math.max(0, Math.min(7, diff));
}

function toggleSession(wi, si) {

function getTotalProgress() { let d=0,t=0; WEEKS.forEach((w,wi)=>{w.sessions.forEach((_,si)=>{t++;if(state.completed[wi+"-"+si])d++;})}); return{done:d,total:t}; }

// ========== GPX PARSER ==========
function haversine(lat1,lon1,lat2,lon2) {
  const R=6371000,p=Math.PI/180,dp=(lat2-lat1)*p,dl=(lon2-lon1)*p;
  const a=Math.sin(dp/2)**2+Math.cos(lat1*p)*Math.cos(lat2*p)*Math.sin(dl/2)**2;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}
function parseGPX(xmlStr) {
  const doc = new DOMParser().parseFromString(xmlStr,"text/xml");
  const trkpts = doc.querySelectorAll("trkpt");
  const nameEl = doc.querySelector("trk > name") || doc.querySelector("name");
  const name = nameEl ? nameEl.textContent : "Corsa";
  const points = [];
  trkpts.forEach(pt => {
    const lat=parseFloat(pt.getAttribute("lat")),lon=parseFloat(pt.getAttribute("lon"));
    const eleEl=pt.querySelector("ele"),timeEl=pt.querySelector("time"),hrEl=pt.querySelector("hr");
    points.push({lat,lon,ele:eleEl?parseFloat(eleEl.textContent):0,time:timeEl?new Date(timeEl.textContent):null,hr:hrEl?parseInt(hrEl.textContent):null});
  });
  if(points.length<2) return null;
  let totalDist=0,kmDist=0,kmStartTime=points[0].time,kmHrs=[],allHrs=[],splits=[];
  for(let i=1;i<points.length;i++){
    const d=haversine(points[i-1].lat,points[i-1].lon,points[i].lat,points[i].lon);
    totalDist+=d;kmDist+=d;
    if(points[i].hr){allHrs.push(points[i].hr);kmHrs.push(points[i].hr);}
    if(kmDist>=1000){
      const secs=(points[i].time-kmStartTime)/1000;
      splits.push({km:splits.length+1,secs,avgHr:kmHrs.length?Math.round(kmHrs.reduce((a,b)=>a+b,0)/kmHrs.length):null});
      kmDist-=1000;kmStartTime=points[i].time;kmHrs=[];
    }
  }
  if(kmDist>100){
    const secs=(points[points.length-1].time-kmStartTime)/1000;
    splits.push({km:splits.length+1,secs:secs/(kmDist/1000),avgHr:kmHrs.length?Math.round(kmHrs.reduce((a,b)=>a+b,0)/kmHrs.length):null,partial:kmDist});
  }
  const totalTime=(points[points.length-1].time-points[0].time)/1000;
  const distKm=totalDist/1000;
  return {
    id: points[0].time.getTime().toString(),
    name, date:points[0].time.toISOString(),
    dateStr:points[0].time.toLocaleDateString("it-IT",{weekday:"short",day:"numeric",month:"short",year:"numeric"}),
    timeStr:points[0].time.toLocaleTimeString("it-IT",{hour:"2-digit",minute:"2-digit"})+" - "+points[points.length-1].time.toLocaleTimeString("it-IT",{hour:"2-digit",minute:"2-digit"}),
    distKm:Math.round(distKm*100)/100, totalTimeSec:totalTime, avgPaceSec:totalTime/distKm,
    avgHr:allHrs.length?Math.round(allHrs.reduce((a,b)=>a+b,0)/allHrs.length):null,
    maxHr:allHrs.length?Math.max(...allHrs):null, splits
  };
}
function formatPace(s){const m=Math.floor(s/60),ss=Math.round(s%60);return m+":"+(ss<10?"0":"")+ss;}
function formatTime(s){const m=Math.floor(s/60),ss=Math.round(s%60);return m+":"+(ss<10?"0":"")+ss;}

function handleGPXFiles(files) {
  Array.from(files).forEach(file => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const activity = parseGPX(e.target.result);
      if (activity) {
        const exists = state.activities.find(a => a.id === activity.id);
        if (!exists) { activitiesRef.child(activity.id).set(activity); }
      }
    };
    reader.readAsText(file);
  });
}
function deleteActivity(id) { activitiesRef.child(id).remove(); state.expandedActivity=null; }
function toggleExpand(idx) { state.expandedActivity=state.expandedActivity===idx?null:idx; render(); }
function openFilePicker() { document.getElementById("gpxInput").click(); }
document.getElementById("gpxInput").addEventListener("change",function(e){handleGPXFiles(e.target.files);this.value="";});

function getPaceBadge(p){if(p<=330)return'<span class="target-badge target-hit">🎯 Target!</span>';if(p<=345)return'<span class="target-badge target-close">↘ Quasi</span>';return'<span class="target-badge target-miss">↗ Sopra</span>';}
function getPaceColor(p){if(p<=330)return"pace-fast";if(p<=360)return"pace-ok";return"pace-slow";}

// ========== RENDER ==========
function render() {
  const app=document.getElementById("app"),tp=getTotalProgress(),pct=Math.round((tp.done/tp.total)*100);
  let html=`<div class="header"><div class="header-top"><span class="icon">🏃</span><div>
    <h1>Piano Corsa 8 Settimane</h1><div class="sub">Da 5:45/km → 5:30/km · Da 6 km → 9-10 km</div></div></div>
    <div class="progress-bar-container"><span>Progresso: ${tp.done}/${tp.total} sessioni</span><span style="font-weight:600">${pct}%</span></div>
    <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
    <div class="sync-status">☁️ Sincronizzato via Firebase</div></div>
    <div class="tabs">
      <button class="tab ${state.view==='plan'?'active':''}" onclick="setView('plan')">Piano</button>
      <button class="tab ${state.view==='overview'?'active':''}" onclick="setView('overview')">8 Settimane</button>
      <button class="tab ${state.view==='analysis'?'active':''}" onclick="setView('analysis')">Analisi</button>
      <button class="tab ${state.view==='rules'?'active':''}" onclick="setView('rules')">Regole</button></div>`;
  if(state.view==="plan")html+=renderPlan();
  else if(state.view==="overview")html+=renderOverview();
  else if(state.view==="analysis")html+=renderAnalysis();
  else html+=renderRules();
  html+='<div class="footer">Piano personalizzato · Età 55 · Sincronizzato su tutti i dispositivi</div>';
  app.innerHTML=html;
}

function renderPlan() {
  const wi=state.selectedWeek,w=WEEKS[wi],curW=getCurrentWeekIndex();
  let h='<div class="week-selector">';
  for(let i=0;i<8;i++){const p=getWeekProgress(i);const isCur=i===curW;
    h+=`<button class="week-btn ${i===wi?'active':''} ${p.done===p.total?'complete':''}" onclick="setWeek(${i})" style="${isCur&&i!==wi?'background:#FFF8E1;':''}">
      <span class="wl">${isCur?'📍':''} Sett.</span><span class="wn">${i+1}</span><span class="wp">${p.done}/${p.total}</span></button>`;}
  h+='</div>';
  const wd=getWeekDates(wi);const isCurWeek=wi===curW;
  h+=`<div class="week-header"><h2>Settimana ${w.week}<span>${w.theme}</span></h2><span class="km">${w.totalKm} km tot</span></div>`;
  h+=`<div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:12px;color:#888">📅 ${wd.label}${isCurWeek?' <span style="background:#1B365D;color:white;padding:1px 8px;border-radius:6px;font-size:10px;font-weight:600;margin-left:4px">SETTIMANA IN CORSO</span>':''}</div>`;
  h+=`<div class="tip">💡 ${w.tip}</div>`;
  w.sessions.forEach((s,si)=>{const c=TYPE_COLORS[s.type];const done=state.completed[wi+"-"+si];
    h+=`<div class="session ${done?'done':''}" style="background:${done?'#F1F8E9':c.bg};border-color:${done?'#C8E6C9':c.border}">
      <div class="session-top"><div class="session-info"><span class="session-icon">${c.icon}</span><div>
        <div class="session-label ${done?'done':''}" style="color:${done?'#689F38':c.text}">${s.label}</div>
        <div class="session-day">${s.day} · ${TYPE_LABELS[s.type]}</div></div></div>
        <button class="check-btn ${done?'done':''}" onclick="toggleSession(${wi},${si})">${done?'✓':''}</button></div>
      <div class="stats">
        <div class="stat"><div class="stat-label">Durata</div><div class="stat-value">${s.duration}</div></div>
        <div class="stat"><div class="stat-label">Distanza</div><div class="stat-value">${s.distance}</div></div>
        <div class="stat"><div class="stat-label">Passo</div><div class="stat-value">${s.pace}</div></div></div>
      <div class="session-note">${s.note}</div></div>`;});
  h+=`<div class="nav-btns"><button class="nav-btn nav-prev" ${wi===0?'disabled':''} onclick="setWeek(${Math.max(0,wi-1)})">← Precedente</button>
    <button class="nav-btn nav-next" ${wi===7?'disabled':''} onclick="setWeek(${Math.min(7,wi+1)})">Successiva →</button></div>`;
  return h;
}

function renderOverview() {
  let h='';const curW=getCurrentWeekIndex();
  WEEKS.forEach((w,wi)=>{const p=getWeekProgress(wi);const c=p.done===p.total;const fp=p.total>0?(p.done/p.total)*100:0;const wd=getWeekDates(wi);const isCur=wi===curW;
    h+=`<div class="overview-card ${c?'complete':''}" style="${isCur?'border-color:#1B365D;border-width:2px;':''}" onclick="setWeek(${wi})"><div class="overview-top"><div style="display:flex;align-items:center;gap:10px">
      <div class="overview-num ${c?'complete':''}">${c?'✓':(wi+1)}</div>
      <div><div class="overview-title">${isCur?'📍 ':''}Sett. ${w.week}: ${w.theme}</div><div class="overview-sub">📅 ${wd.label} · ${w.sessions.length} sessioni · ${w.totalKm} km</div></div></div>
      <div style="text-align:right"><div style="font-size:11px;color:#999">${p.done}/${p.total}</div>
      <div class="overview-prog"><div class="overview-prog-fill" style="width:${fp}%;background:${c?'#4CAF50':'#1B365D'}"></div></div></div></div>
      <div class="overview-tags">`;
    w.sessions.forEach(s=>{const cl=TYPE_COLORS[s.type];h+=`<span class="overview-tag" style="background:${cl.bg};color:${cl.text};border-color:${cl.border}">${s.day} ${cl.icon} ${s.distance}</span>`;});
    h+='</div></div>';});
  h+='<div class="volume-chart"><h3>Volume settimanale (km)</h3><div class="bars">';
  WEEKS.forEach((w,i)=>{const hp=(w.totalKm/20)*100;const dl=(w.week===4||w.week===8);
    h+=`<div class="bar-col"><span class="bar-val">${w.totalKm}</span><div class="bar ${dl?'deload':'load'}" style="height:${hp}%"></div><span class="bar-label">S${i+1}</span></div>`;});
  h+='</div><div class="legend"><span>🟦 Carico</span><span>🟩 Scarico</span></div></div>';
  return h;
}

function renderAnalysis() {
  let h=`<div class="upload-zone" onclick="openFilePicker()"><div class="uz-icon">📂</div>
    <div class="uz-title">Carica file GPX da Strava</div><div class="uz-sub">I dati si sincronizzano su tutti i dispositivi</div></div>`;
  const acts=state.activities;
  if(!acts.length){h+='<div class="no-data">Nessuna attività caricata.<br>Esporta i GPX da Strava e caricali qui.</div>';return h;}
  if(acts.length>=2)h+=renderProgressionChart(acts);
  const totalKm=acts.reduce((s,a)=>s+a.distKm,0);
  const bestPace=Math.min(...acts.map(a=>a.avgPaceSec));
  const longestRun=Math.max(...acts.map(a=>a.distKm));
  h+=`<div class="activity-card" style="margin-bottom:14px"><div style="font-weight:700;font-size:13px;color:#1B365D;margin-bottom:8px">📊 Riepilogo</div>
    <div class="activity-stats">
      <div class="a-stat"><div class="a-stat-val">${acts.length}</div><div class="a-stat-lbl">Uscite</div></div>
      <div class="a-stat"><div class="a-stat-val">${Math.round(totalKm*10)/10}</div><div class="a-stat-lbl">Km totali</div></div>
      <div class="a-stat"><div class="a-stat-val">${formatPace(bestPace)}</div><div class="a-stat-lbl">Miglior pace</div></div>
      <div class="a-stat"><div class="a-stat-val">${longestRun.toFixed(1)}</div><div class="a-stat-lbl">Km max</div></div></div></div>`;
  const reversed=[...acts].reverse();
  reversed.forEach((a,ri)=>{
    const idx=acts.length-1-ri;const expanded=state.expandedActivity===idx;
    h+=`<div class="activity-card"><div class="activity-header" onclick="toggleExpand(${idx})" style="cursor:pointer">
      <div><div class="activity-date">${a.dateStr}</div><div class="activity-name">${a.name} · ${a.timeStr}</div></div>
      <div style="display:flex;align-items:center;gap:8px">${getPaceBadge(a.avgPaceSec)}
        <button class="activity-del" onclick="event.stopPropagation();deleteActivity('${a.id}')">✕</button></div></div>
      <div class="activity-stats">
        <div class="a-stat"><div class="a-stat-val">${a.distKm}</div><div class="a-stat-lbl">Km</div></div>
        <div class="a-stat"><div class="a-stat-val">${formatTime(a.totalTimeSec)}</div><div class="a-stat-lbl">Tempo</div></div>
        <div class="a-stat"><div class="a-stat-val">${formatPace(a.avgPaceSec)}</div><div class="a-stat-lbl">Passo</div></div>
        <div class="a-stat"><div class="a-stat-val">${a.avgHr||'-'}</div><div class="a-stat-lbl">FC med</div></div></div>`;
    if(expanded&&a.splits&&a.splits.length>0){
      h+=`<table class="splits-table"><thead><tr><th>Km</th><th>Passo</th><th>FC</th><th></th></tr></thead><tbody>`;
      const maxP=Math.max(...a.splits.map(s=>s.secs)),minP=Math.min(...a.splits.map(s=>s.secs));
      a.splits.forEach(s=>{
        const barW=Math.max(10,Math.min(100,((maxP-s.secs)/(maxP-minP+1))*100));
        const partial=s.partial?` <span style="color:#999;font-size:10px">(${(s.partial/1000).toFixed(1)}km)</span>`:'';
        h+=`<tr><td style="font-weight:600">${s.km}${partial}</td><td style="font-weight:600">${formatPace(s.secs)}/km</td>
          <td>${s.avgHr?s.avgHr+' bpm':'-'}</td><td style="width:60px"><div class="pace-bar-bg"><div class="pace-bar-fill ${getPaceColor(s.secs)}" style="width:${barW}%"></div></div></td></tr>`;});
      h+='</tbody></table>';
      if(a.splits.length>=4){
        const fh=a.splits.slice(0,Math.floor(a.splits.length/2));
        const sh=a.splits.slice(Math.floor(a.splits.length/2)).filter(s=>!s.partial);
        if(sh.length>0){const af=fh.reduce((s,x)=>s+x.secs,0)/fh.length;const as2=sh.reduce((s,x)=>s+x.secs,0)/sh.length;
          if(as2<af)h+=`<div class="tip" style="margin-top:8px">🔥 Negative split! Seconda metà più veloce di ${Math.round(af-as2)} sec/km</div>`;}
      }
    }
    h+='</div>';});
  return h;
}

function renderProgressionChart(acts) {
  const W=280,H=120,pL=40,pR=10,pT=10,pB=25,cw=W-pL-pR,ch=H-pT-pB;
  const paces=acts.map(a=>a.avgPaceSec),minP=Math.min(...paces)-10,maxP=Math.max(...paces)+10;
  const pts=acts.map((a,i)=>({x:pL+(acts.length===1?cw/2:(i/(acts.length-1))*cw),y:pT+((a.avgPaceSec-minP)/(maxP-minP))*ch,pace:a.avgPaceSec,date:(a.dateStr||'').substring(0,6)}));
  const tY=pT+((330-minP)/(maxP-minP))*ch;
  let pathD=pts.map((p,i)=>(i===0?'M':'L')+p.x.toFixed(1)+','+p.y.toFixed(1)).join(' ');
  let svg=`<svg viewBox="0 0 ${W} ${H}" class="chart-svg" xmlns="http://www.w3.org/2000/svg">`;
  if(tY>=pT&&tY<=pT+ch){svg+=`<line x1="${pL}" y1="${tY.toFixed(1)}" x2="${pL+cw}" y2="${tY.toFixed(1)}" stroke="#4CAF50" stroke-width="1" stroke-dasharray="4,3" opacity="0.6"/>`;
    svg+=`<text x="${pL-3}" y="${tY.toFixed(1)}" text-anchor="end" font-size="8" fill="#4CAF50" dy="3">5:30</text>`;}
  for(let p=Math.ceil(minP/30)*30;p<=maxP;p+=30){const y=pT+((p-minP)/(maxP-minP))*ch;
    svg+=`<text x="${pL-3}" y="${y.toFixed(1)}" text-anchor="end" font-size="8" fill="#999" dy="3">${formatPace(p)}</text>`;
    svg+=`<line x1="${pL}" y1="${y.toFixed(1)}" x2="${pL+cw}" y2="${y.toFixed(1)}" stroke="#eee" stroke-width="0.5"/>`;}
  svg+=`<path d="${pathD}" fill="none" stroke="#1B365D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>`;
  pts.forEach(p=>{svg+=`<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="4" fill="#1B365D" stroke="white" stroke-width="1.5"/>`;
    svg+=`<text x="${p.x.toFixed(1)}" y="${(p.y-8).toFixed(1)}" text-anchor="middle" font-size="8" font-weight="600" fill="#333">${formatPace(p.pace)}</text>`;});
  if(pts.length<=10)pts.forEach(p=>{svg+=`<text x="${p.x.toFixed(1)}" y="${H-3}" text-anchor="middle" font-size="7" fill="#999">${p.date}</text>`;});
  svg+='</svg>';
  return `<div class="progression-chart"><h3>📈 Progressione passo medio</h3>
    <div style="font-size:10px;color:#888;margin-bottom:6px">Linea tratteggiata = target 5:30/km · Più in basso = più veloce</div>
    <div class="chart-area">${svg}</div></div>`;
}

function renderRules() {
  let h='';RULES.forEach(r=>{h+=`<div class="rule"><div class="rule-inner"><span class="rule-icon">${r.icon}</span><div><div class="rule-title">${r.title}</div><div class="rule-text">${r.text}</div></div></div></div>`;});
  return h;
}

render();
</script>

</html>
